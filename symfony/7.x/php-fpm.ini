date.timezone=Etc/UTC
short_open_tag=Off
log_errors=On
error_reporting=E_ALL
display_errors=Off
error_log=/proc/1/fd/2
memory_limit=512M

post_max_size=100M
upload_max_filesize=100M

; Optimizations for Symfony, as documented on http://symfony.com/doc/current/performance.html
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600

; php2shell (CVE-2026-109618 / CVE-2026-109619, 21/10/2026). Fonctionnalité inutilisée par nos
; applis, active par défaut, et point d'entrée d'au moins une des deux failles : coupée par défaut.
session.upload_progress.enabled = 0
