# HTTP/1.1 seulement, même si une appli active mod_http2 : Traefik parle aux pods en HTTP/1.1 et
# Cloudflare termine le HTTP/2 côté client, il n'y a rien à gagner à l'exposer ici.
Protocols http/1.1

# Protocols ne suffit pas : H2Direct laisse passer le h2c en « prior knowledge » (préface PRI
# envoyée d'emblée) sur une connexion en clair, quelle que soit la liste ci-dessus. Vérifié en
# 2.4.71 avec mod_http2 activé : HTTP/2 servi tant que H2Direct n'est pas coupé.
<IfModule http2_module>
    H2Direct off
</IfModule>

